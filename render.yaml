# Render Blueprint — one-click deploy: https://render.com/deploy?repo=https://github.com/anchovy8781/Joker
# Free web service (512 MB). Database: Supabase (free). See docs/CLOUD_DEPLOY.md.
services:
  - type: web
    name: youtube-exchange
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/market/hours
    autoDeploy: true
    envVars:
      - key: YEX_DATABASE_URL          # Supabase "Session pooler" URI (see guide), with +psycopg
        sync: false
      - key: YEX_TICK_SECRET           # copy this value into deploy/supabase/setup.sql
        generateValue: true
      - key: YEX_IP_HASH_SECRET
        generateValue: true
      - key: YEX_YOUTUBE_API_KEY       # optional
        sync: false
      - key: YEX_ENV
        value: production
      - key: YEX_COOKIE_SECURE
        value: "true"
      - key: YEX_TRUSTED_PROXY_HOPS
        value: "1"
      - key: YEX_CORS_ORIGINS
        value: "[]"
      - key: YEX_DB_POOL_SIZE           # simulator holds 2, the minute tick 1; the rest serve players
        value: "6"
      - key: YEX_DB_MAX_OVERFLOW
        value: "4"
      - key: YEX_BOOTSTRAP_ADMIN_USERNAME   # first admin (created once at startup)
        sync: false
      - key: YEX_BOOTSTRAP_ADMIN_PASSWORD   # 10+ characters
        sync: false
      - key: YEX_SEED_DEMO                  # "true" = list the 8 DEMO stocks on first start
        value: "true"
