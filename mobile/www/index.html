<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src https://api.github.com https: http:; img-src 'self' data:">
<title>YouTube Exchange</title>
<link rel="stylesheet" href="launcher.css">
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">▶</div>
  <h1>YouTube Exchange</h1>
  <p class="sub">유튜브 채널 가상 주식 거래 게임</p>

  <section id="auto">
    <div class="spinner" aria-hidden="true"></div>
    <p id="status" role="status">서버에 연결하는 중…</p>
    <div id="failed" hidden>
      <button id="retry">다시 시도</button>
      <button id="change" class="link">다른 서버 주소 입력</button>
    </div>
  </section>

  <form id="setup" hidden>
    <label for="url">거래 서버 주소</label>
    <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://xxxx.trycloudflare.com" required>
    <button type="submit">연결</button>
    <p id="error" class="error" role="alert"></p>
    <button type="button" id="auto-retry" class="ghost">자동 연결 다시 시도</button>
    <p class="hint">보통은 입력할 필요가 없어요. 직접 운영하는 서버가 있을 때만 사용하세요.</p>
  </form>

  <p class="foot">모든 거래는 현금 가치가 없는 게임 크레딧으로만 이루어집니다.</p>
</main>
<script src="server-config.js"></script>
<script src="launcher.js"></script>
</body>
</html>
